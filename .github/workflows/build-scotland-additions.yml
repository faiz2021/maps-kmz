name: Build Scotland Additions KMZ

on:
  push:
    paths:
      - 'build_scotland_additions.py'
      - '.github/workflows/build-scotland-additions.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: pip install pillow
      - name: Build Scotland additions
        run: python build_scotland_additions.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scotland-additions-2026.kmz scotland-additions-report.txt scotland-additions-resolved.csv
          git diff --cached --quiet || git commit -m "Build Scotland tourist additions KMZ"
          git push
