name: Build Edinburgh KMZ

on:
  push:
    paths:
      - 'edinburgh-additions-2026.kml'
      - 'build_edinburgh_icons.py'
      - 'Austria.kmz'
      - '.github/workflows/build-edinburgh-kmz.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image support
        run: python -m pip install --quiet pillow
      - name: Build KMZ with Tourist Maps icons
        run: python build_edinburgh_icons.py
      - name: Commit KMZ and icon report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edinburgh-additions-2026.kmz edinburgh-icon-map.txt
          git diff --cached --quiet || git commit -m "Build Edinburgh additions with Tourist Maps icons"
          git push
