name: Build Edinburgh KMZ

on:
  push:
    paths:
      - 'edinburgh-additions-2026.kml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build KMZ
        run: |
          rm -f edinburgh-additions-2026.kmz
          zip -j edinburgh-additions-2026.kmz edinburgh-additions-2026.kml
      - name: Commit KMZ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edinburgh-additions-2026.kmz
          git diff --cached --quiet || git commit -m "Build Edinburgh additions KMZ"
          git push
