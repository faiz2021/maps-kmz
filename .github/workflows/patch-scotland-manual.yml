name: Patch Scotland Final Verified

on:
  push:
    paths:
      - 'patch_scotland_manual.py'
      - '.github/workflows/patch-scotland-manual.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: Build verified final KMZ
        run: python patch_scotland_manual.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scotland-additions-2026-final-verified.kmz scotland-additions-verified-report.txt scotland-additions-final-verified.csv
          git diff --cached --quiet || git commit -m "Build verified Scotland additions KMZ"
          git push
