name: Patch Scotland Food Additions

on:
  push:
    paths:
      - 'patch_scotland_food_additions.py'
      - '.github/workflows/patch-scotland-food-additions.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch final KMZ
        run: python patch_scotland_food_additions.py
      - name: Commit final outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scotland-edinburgh-glasgow-food-additions-2026-final.kmz scotland-food-additions-final-report.txt
          git diff --cached --quiet || git commit -m "Patch Scotland Edinburgh Glasgow food additions KMZ"
          git push
