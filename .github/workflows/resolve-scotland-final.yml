name: Resolve Scotland Additions Final

on:
  push:
    paths:
      - 'resolve_scotland_failed.py'
      - '.github/workflows/resolve-scotland-final.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: pip install pillow
      - name: Resolve remaining places and build final KMZ
        run: python resolve_scotland_failed.py
      - name: Commit final outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scotland-additions-2026-final.kmz scotland-additions-final-report.txt scotland-additions-final.csv
          git diff --cached --quiet || git commit -m "Build final Scotland tourist additions KMZ"
          git push
