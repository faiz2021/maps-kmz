name: Patch Scotland Food Natural Descriptions
on:
  push:
    paths:
      - 'patch_scotland_food_natural_descriptions.py'
      - '.github/workflows/patch-scotland-food-natural.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite descriptions
        run: python patch_scotland_food_natural_descriptions.py
      - name: Commit updated KMZ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scotland-edinburgh-glasgow-food-additions-47-natural.kmz
          git diff --cached --quiet || git commit -m "Rewrite food map descriptions for users"
          git push
