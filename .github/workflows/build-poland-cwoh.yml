name: Build Poland official hotel coordinates

on:
  push:
    branches:
      - tmp/poland-hotel-map-20260826
    paths:
      - 'poland_build/fetch_cwoh.py'
      - '.github/workflows/build-poland-cwoh.yml'

permissions:
  contents: read

actions: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install HTTP client
        run: python -m pip install --quiet requests
      - name: Fetch official CWOH accommodation registry
        run: python poland_build/fetch_cwoh.py
      - name: Upload official registry snapshot
        uses: actions/upload-artifact@v4
        with:
          name: poland-cwoh-registry
          path: |
            poland_build/cwoh.json.gz
            poland_build/cwoh_report.txt
          if-no-files-found: error
          retention-days: 1
